<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麺Earth 領土管制</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>

<style>
  :root{
    --void: #0A0E1C;
    --void-deep: #050710;
    --panel: rgba(14,20,38,0.78);
    --panel-solid: #0F1526;
    --grid-line: rgba(120,180,255,0.07);
    --border: rgba(120,170,255,0.22);
    --cyan: #4FE3D0;
    --cyan-dim: rgba(79,227,208,0.35);
    --violet: #9D8CFF;
    --amber: #FFB454;
    --danger: #FF5C72;
    --text: #E7ECFF;
    --text-dim: #7E8AB8;
    --land: #182140;
    --land-line: rgba(120,170,255,0.18);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--void-deep);
    color: var(--text);
    font-family: "Noto Sans JP", sans-serif;
    overflow:hidden;
  }
  h1,h2,.display{ font-family:"Space Grotesk","Noto Sans JP",sans-serif; font-weight:700; letter-spacing:.01em; }
  .mono{ font-family:"JetBrains Mono", monospace; }
  button, input{ font-family:inherit; }

  .grid-bg{
    position:fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-color: var(--void-deep);
  }

  .hud{ position:relative; }
  .corner{ position:absolute; width:14px; height:14px; border-color:var(--cyan); pointer-events:none; }
  .corner-tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
  .corner-tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
  .corner-bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
  .corner-br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }

  .screen{ height:100vh; display:flex; align-items:center; justify-content:center; }

  .badge{
    width:56px; height:56px; flex-shrink:0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(155deg, #16224A, #0B1330);
    border: 1px solid var(--cyan-dim);
    display:flex; align-items:center; justify-content:center;
    font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:20px;
    color: var(--cyan);
    box-shadow: 0 0 18px rgba(79,227,208,0.25);
  }

  .login-card{
    width:min(400px,88vw);
    padding:44px 34px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border:1px solid var(--border);
    text-align:center;
  }
  .login-card .badge{ margin:0 auto 22px; }
  .login-card h1{ margin:0 0 10px; font-size:21px; }
  .login-card p{ margin:0 0 26px; font-size:13.5px; color:var(--text-dim); line-height:1.8; }

  .btn{
    border:1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 11px 20px;
    font-size: 13.5px;
    cursor:pointer;
    letter-spacing:.01em;
    transition: border-color .15s, box-shadow .15s, color .15s;
  }
  .btn:hover{ border-color: var(--cyan-dim); box-shadow: 0 0 0 1px var(--cyan-dim) inset; }
  .btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .btn-fill{ background: var(--cyan); color:#04201C; border-color:var(--cyan); font-weight:500; }
  .btn-fill:hover{ box-shadow: 0 0 16px rgba(79,227,208,0.45); }
  .btn-danger{ border-color: rgba(255,92,114,0.5); color: var(--danger); }
  .btn-danger:hover{ box-shadow: 0 0 0 1px rgba(255,92,114,0.5) inset; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:6px 12px; font-size:12px; }

  #app{ height:100vh; display:flex; flex-direction:column; }

  #top-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 22px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  #top-bar-left{ display:flex; align-items:center; gap:14px; }
  #top-bar-left .badge{ width:38px; height:38px; font-size:14px; }
  #site-title{ font-size:15px; margin:0; }
  #user-tag{ font-size:11.5px; color:var(--text-dim); }
  #top-bar-right{ display:flex; align-items:center; gap:10px; }

  .icon-btn{
    background:none; border:1px solid transparent; color:var(--text);
    font-size:19px; cursor:pointer; padding:5px 11px; line-height:1;
  }
  .icon-btn:hover{ border-color: var(--border); color:var(--cyan); }

  #map-wrap{ position:relative; flex:1; overflow:hidden; background: var(--void-deep); }
  #map-svg{ width:100%; height:100%; cursor:grab; display:block; }
  #map-svg:active{ cursor:grabbing; }
  #map-svg path{
    stroke: var(--land-line);
    stroke-width: 0.4;
    fill: var(--land);
    transition: fill .12s, filter .12s;
  }
  #map-svg path:hover{ filter: brightness(1.3); stroke: var(--cyan); stroke-width:0.8; }
  #map-svg path.is-claimed{ stroke: rgba(255,255,255,0.25); }

  .tooltip{
    position:absolute; pointer-events:none;
    background: var(--panel-solid);
    border-left: 2px solid var(--cyan);
    border-top:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding: 7px 12px;
    font-size:12px; color: var(--text);
    z-index:50; white-space:nowrap;
  }
  .tooltip .mono{ color:var(--text-dim); font-size:11px; }

  #empty-hint{
    position:absolute; left:20px; bottom:20px;
    max-width: 280px;
    padding: 18px 20px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    font-size:13px; line-height:1.8; color: var(--text-dim);
    z-index:20;
  }
  #empty-hint .btn{ margin-top:12px; }

  #legend{
    position:absolute; right:20px; bottom:20px;
    width: 230px; max-height: 40vh; overflow-y:auto;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    z-index:20;
  }
  #legend h2{
    margin:0; padding:11px 15px; font-size:12.5px; font-weight:500;
    border-bottom:1px solid var(--border); color:var(--text-dim);
    font-family:"Noto Sans JP",sans-serif;
  }
  #legend-list{ padding:4px 0; }
  .legend-row{ display:flex; align-items:center; gap:9px; padding:6px 15px; font-size:12px; color:var(--text); }
  .legend-swatch{ width:11px; height:11px; flex-shrink:0; box-shadow:0 0 6px 0 currentColor; }
  .legend-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-count{ color:var(--text-dim); }
  #legend-empty{ padding:12px 15px; font-size:12px; color:var(--text-dim); }

  .modal-overlay{
    position:fixed; inset:0; background: rgba(3,5,12,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .panel{
    width: 340px; max-width:90vw;
    background: var(--panel-solid);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 30px 28px;
  }
  .panel h2{ margin: 0 0 4px; font-size:18px; }
  .panel .panel-sub{ margin:0 0 22px; font-size:12px; color:var(--text-dim); }
  .panel label{ display:block; margin-top:14px; margin-bottom:6px; font-size:12px; color:var(--text-dim); }
  .panel input[type="text"]{
    width:100%; padding:10px 11px; border:1px solid var(--border);
    background: rgba(255,255,255,0.03); color:var(--text); font-size:14px;
  }
  .panel input[type="text"]:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan-dim); }
  .color-row{ display:flex; gap:8px; align-items:center; }
  .color-row input[type="text"]{ flex:1; }
  .color-row input[type="color"]{ width:38px; height:38px; padding:0; border:1px solid var(--border); background:none; cursor:pointer; }
  .panel .hint{ font-size:12px; color:var(--text-dim); margin-top:14px; line-height:1.7; }
  .panel-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
  .panel hr{ border:none; border-top:1px solid var(--border); margin:20px 0; }

  #overwrite-question{ margin:0; font-size:14.5px; line-height:1.7; }
  .skip-row{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .skip-row span{ font-size:12px; color:var(--text-dim); }
  .skip-row .btn-sm-group{ display:flex; gap:6px; }

  .side-menu{
    position:fixed; top:0; right:0; bottom:0;
    width:320px; max-width:90vw;
    background: var(--panel-solid);
    color: var(--text);
    border-left: 1px solid var(--border);
    padding: 24px 26px;
    z-index:90;
    overflow-y:auto;
  }
  .side-menu-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .side-menu-header h2{ margin:0; font-size:18px; }
  .side-menu-header .icon-btn{ font-size:20px; }
  .side-menu label{ display:block; margin-top:14px; margin-bottom:6px; font-size:12px; color:var(--text-dim); }
  .side-menu input[type="text"]{
    width:100%; padding:10px 11px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); font-size:14px;
  }
  .side-menu input[type="text"]:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan-dim); }
  .side-menu .btn{ margin-top:16px; }
  .side-menu hr{ border:none; border-top:1px solid var(--border); margin:22px 0; }
  .stat-line{ font-size:13px; color:var(--text-dim); }
  .stat-line b{ color:var(--text); font-family:"JetBrains Mono",monospace; font-weight:500; }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  @media (max-width:560px){
    #legend{ width:180px; }
    .panel{ padding:24px 20px; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<!-- ログインゲート -->
<div id="login-screen" class="screen">
  <div class="login-card hud">
    <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
    <span class="corner corner-bl"></span><span class="corner corner-br"></span>
    <div class="badge">麺</div>
    <h1>麺Earth 領土管制</h1>
    <p>このマップを開くにはDiscord認証が必要です。<br>認証後、国を興して地図の区画を治められます。</p>
    <button id="discord-login-btn" class="btn btn-fill btn-block">Discordでログイン</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" class="hidden">

  <header id="top-bar">
    <div id="top-bar-left">
      <div class="badge">麺</div>
      <div>
        <h1 id="site-title">麺Earth 領土管制</h1>
        <div id="user-tag" class="mono"></div>
      </div>
    </div>
    <div id="top-bar-right">
      <button id="found-nation-btn" class="btn btn-fill hidden">建国する</button>
      <button id="menu-btn" class="icon-btn" title="自国の管理" aria-label="自国の管理">☰</button>
    </div>
  </header>

  <div id="map-wrap">
    <svg id="map-svg"></svg>
    <div id="hover-tooltip" class="tooltip hidden"></div>

    <div id="empty-hint" class="hud hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      まだ国がありません。「建国する」から国名と色を決めると、地図の区画をクリックして領土にできます。
      <div><button id="empty-hint-found-btn" class="btn btn-sm btn-fill">建国する</button></div>
    </div>

    <div id="legend" class="hud">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <h2>治めている国</h2>
      <div id="legend-list"></div>
      <div id="legend-empty">まだ主張された領土はありません。</div>
    </div>
  </div>

  <!-- 建国モーダル -->
  <div id="claim-modal" class="modal-overlay hidden">
    <div class="panel hud">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <h2>建国する</h2>
      <p class="panel-sub">国名と色を決めてください。あとで変更できます。</p>
      <label>国名</label>
      <input id="claim-country-name" type="text" maxlength="20" placeholder="例: 麺王国">
      <label>色</label>
      <div class="color-row">
        <input id="claim-color-picker" type="color" value="#3388ff">
        <input id="claim-color-hex" type="text" placeholder="#3388ff" maxlength="7">
        <button id="claim-random-color-btn" class="btn btn-sm">ランダム</button>
      </div>
      <p class="hint">建国すると地図の区画をクリックして領土にできます。1人につき1国です。</p>
      <div class="panel-actions">
        <button id="claim-cancel-btn" class="btn">やめる</button>
        <button id="claim-save-btn" class="btn btn-fill">建国する</button>
      </div>
    </div>
  </div>

  <!-- 上書き確認モーダル -->
  <div id="overwrite-modal" class="modal-overlay hidden">
    <div class="panel hud">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <p id="overwrite-question"></p>
      <div class="panel-actions">
        <button id="overwrite-no-btn" class="btn">いいえ</button>
        <button id="overwrite-yes-btn" class="btn btn-fill">はい</button>
      </div>
      <hr>
      <div class="skip-row">
        <span>今後この確認を表示しない</span>
        <div class="btn-sm-group">
          <button id="skip-no-btn" class="btn btn-sm">いいえ</button>
          <button id="skip-yes-btn" class="btn btn-sm btn-fill">はい</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 自国の管理(右上ハンバーガー) -->
  <div id="side-menu" class="side-menu hidden">
    <div class="side-menu-header">
      <h2>自国の管理</h2>
      <button id="menu-close-btn" class="icon-btn" aria-label="閉じる">×</button>
    </div>

    <div id="menu-no-country" class="hidden">
      <p class="stat-line">まだ国を興していません。</p>
      <button id="menu-create-country-btn" class="btn btn-fill btn-block">建国する</button>
    </div>

    <div id="menu-has-country">
      <label>国名</label>
      <input id="edit-country-name" type="text" maxlength="20">
      <label>色</label>
      <div class="color-row">
        <input id="edit-color-picker" type="color">
        <input id="edit-color-hex" type="text" maxlength="7">
        <button id="edit-random-color-btn" class="btn btn-sm">ランダム</button>
      </div>
      <button id="edit-save-btn" class="btn btn-fill btn-block">変更を保存</button>
      <hr>
      <p class="stat-line">治めている区画: <b id="edit-region-count" class="mono">0</b></p>
      <button id="edit-delete-country-btn" class="btn btn-danger btn-block">建国を取り消す(すべての領土を解放)</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithCustomToken
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, onValue, set, update, get, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ---------- 設定(自分のプロジェクトの値に書き換え) ----------
const firebaseConfig = {
  apiKey: "AIzaSyA5WfSMmLGVjPSJ0GGlzE4IX01Sz_q-KhQ",
  authDomain: "menearth-land.firebaseapp.com",
  databaseURL: "https://menearth-land-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "menearth-land",
  storageBucket: "menearth-land.firebasestorage.app",
  messagingSenderId: "839472773997",
  appId: "1:839472773997:web:a3d740c805056e82b0f864"
};
const WORKER_BASE_URL = "https://your-worker-subdomain.workers.dev";
const MAP_DATA_URL = "./data/admin1.json";
const SKIP_KEY = "menearth_skip_overwrite_warning";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);

let currentUser = null;
let myCountry = null;
let myDiscordClaims = {};
let claimsCache = {};
let pathSelection = null;
let pendingRegionId = null;
let mapInitialized = false;

const el = (id) => document.getElementById(id);

// ---------- 認証 ----------
async function handleTokenFromUrl() {
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  if (token) {
    try {
      await signInWithCustomToken(auth, token);
    } catch (e) {
      console.error("ログイン失敗:", e);
      alert("ログインに失敗しました。もう一度お試しください。");
    }
    params.delete("token");
    const newUrl = location.pathname + (params.toString() ? "?" + params.toString() : "");
    history.replaceState({}, "", newUrl);
  }
}

el("discord-login-btn").addEventListener("click", () => {
  const redirect = encodeURIComponent(location.origin + location.pathname);
  location.href = `${WORKER_BASE_URL}/auth?redirect=${redirect}`;
});

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    el("login-screen").classList.add("hidden");
    el("app").classList.remove("hidden");
    el("app").style.display = "flex";

    const tokenResult = await user.getIdTokenResult();
    myDiscordClaims = {
      discordId: tokenResult.claims.discordId || null,
      discordName: tokenResult.claims.discordName || null
    };
    el("user-tag").textContent = myDiscordClaims.discordName ? `@${myDiscordClaims.discordName}` : "接続中";

    initMapOnce();
    watchMyCountry();
    watchClaims();
  } else {
    el("app").classList.add("hidden");
    el("app").style.display = "none";
    el("login-screen").classList.remove("hidden");
  }
});

// ---------- 地図描画 ----------
async function initMapOnce() {
  if (mapInitialized) return;
  mapInitialized = true;

  const svg = d3.select("#map-svg");
  const width = svg.node().clientWidth || 960;
  const height = svg.node().clientHeight || 600;

  const topo = await (await fetch(MAP_DATA_URL)).json();
  const objectKey = Object.keys(topo.objects)[0];
  const geo = topojson.feature(topo, topo.objects[objectKey]);

  const projection = d3.geoNaturalEarth1().fitSize([width, height], geo);
  const path = d3.geoPath().projection(projection);
  const g = svg.append("g");

  pathSelection = g.selectAll("path")
    .data(geo.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("data-region-id", (d) => regionIdOf(d))
    .on("click", (event, d) => onRegionClick(regionIdOf(d), regionNameOf(d)))
    .on("mousemove", (event, d) => showTooltip(event, regionIdOf(d), regionNameOf(d)))
    .on("mouseleave", hideTooltip);

  svg.call(
    d3.zoom().scaleExtent([1, 8]).on("zoom", (event) => {
      g.attr("transform", event.transform);
    })
  );

  applyClaimColors();
}

function regionIdOf(f){
  return String(f.id ?? f.properties.id ?? f.properties.iso_3166_2 ?? f.properties.name);
}
function regionNameOf(f){ return f.properties.name || regionIdOf(f); }

function showTooltip(event, regionId, name){
  const tip = el("hover-tooltip");
  const claim = claimsCache[regionId];
  tip.classList.remove("hidden");
  tip.style.left = event.offsetX + 14 + "px";
  tip.style.top = event.offsetY + 14 + "px";
  tip.innerHTML = claim
    ? `${escapeHtml(name)}<br><span class="mono">${escapeHtml(claim.name)}</span>`
    : escapeHtml(name);
}
function hideTooltip(){ el("hover-tooltip").classList.add("hidden"); }

function applyClaimColors(){
  if (!pathSelection) return;
  pathSelection
    .attr("fill", (d) => {
      const claim = claimsCache[regionIdOf(d)];
      return claim ? claim.color : null;
    })
    .classed("is-claimed", (d) => !!claimsCache[regionIdOf(d)])
    .style("filter", (d) => {
      const claim = claimsCache[regionIdOf(d)];
      return claim ? `drop-shadow(0 0 5px ${claim.color}99)` : null;
    });
}

// ---------- Firebase購読 ----------
function watchMyCountry(){
  onValue(ref(db, `countries/${currentUser.uid}`), (snap) => {
    myCountry = snap.val();
    renderTopBar();
    renderSideMenu();
    renderEmptyHint();
  });
}
function watchClaims(){
  onValue(ref(db, "claims"), (snap) => {
    claimsCache = snap.val() || {};
    applyClaimColors();
    renderSideMenu();
    renderLegend();
  });
}

function renderTopBar(){
  el("found-nation-btn").classList.toggle("hidden", !!myCountry);
}
function renderEmptyHint(){
  el("empty-hint").classList.toggle("hidden", !!myCountry);
}

// ---------- 凡例 ----------
function renderLegend(){
  const byOwner = {};
  for (const claim of Object.values(claimsCache)) {
    if (!byOwner[claim.ownerUid]) byOwner[claim.ownerUid] = { name: claim.name, color: claim.color, count: 0 };
    byOwner[claim.ownerUid].count++;
  }
  const entries = Object.values(byOwner).sort((a, b) => b.count - a.count);
  const list = el("legend-list");
  list.innerHTML = "";
  el("legend-empty").classList.toggle("hidden", entries.length > 0);
  for (const c of entries) {
    const row = document.createElement("div");
    row.className = "legend-row";
    row.style.color = c.color;
    row.innerHTML = `<span class="legend-swatch" style="background:${c.color}"></span>
                      <span class="legend-name" style="color:var(--text)">${escapeHtml(c.name)}</span>
                      <span class="legend-count mono">${c.count}</span>`;
    list.appendChild(row);
  }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

// ---------- クリック時の主張ロジック ----------
function onRegionClick(regionId, regionName){
  if (!myCountry) { openClaimModal(); return; }
  const existing = claimsCache[regionId];
  if (existing && existing.ownerUid !== currentUser.uid) {
    if (localStorage.getItem(SKIP_KEY) === "1") {
      claimRegion(regionId);
    } else {
      pendingRegionId = regionId;
      el("overwrite-question").textContent = `ここを触ると「${existing.name}」も同じ範囲になりますがいいですか?`;
      el("overwrite-modal").classList.remove("hidden");
    }
    return;
  }
  claimRegion(regionId);
}

async function claimRegion(regionId){
  await set(ref(db, `claims/${regionId}`), {
    ownerUid: currentUser.uid,
    name: myCountry.name,
    color: myCountry.color,
    updatedAt: serverTimestamp()
  });
}

el("overwrite-yes-btn").addEventListener("click", () => {
  el("overwrite-modal").classList.add("hidden");
  if (pendingRegionId) claimRegion(pendingRegionId);
  pendingRegionId = null;
});
el("overwrite-no-btn").addEventListener("click", () => {
  el("overwrite-modal").classList.add("hidden");
  pendingRegionId = null;
});
el("skip-yes-btn").addEventListener("click", () => localStorage.setItem(SKIP_KEY, "1"));
el("skip-no-btn").addEventListener("click", () => localStorage.setItem(SKIP_KEY, "0"));

// ---------- 建国モーダル ----------
function openClaimModal(){
  el("claim-country-name").value = "";
  const c = randomHex();
  el("claim-color-picker").value = c;
  el("claim-color-hex").value = c;
  el("claim-modal").classList.remove("hidden");
}
el("found-nation-btn").addEventListener("click", () => {
  if (myCountry) return;
  openClaimModal();
});
el("empty-hint-found-btn").addEventListener("click", openClaimModal);
el("claim-cancel-btn").addEventListener("click", () => el("claim-modal").classList.add("hidden"));
el("claim-color-picker").addEventListener("input", (e) => el("claim-color-hex").value = e.target.value);
el("claim-color-hex").addEventListener("input", (e) => {
  if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) el("claim-color-picker").value = e.target.value;
});
el("claim-random-color-btn").addEventListener("click", () => {
  const c = randomHex();
  el("claim-color-picker").value = c;
  el("claim-color-hex").value = c;
});
el("claim-save-btn").addEventListener("click", async () => {
  const name = el("claim-country-name").value.trim();
  const color = el("claim-color-hex").value.trim();
  if (!name) { alert("国名を入力してください。"); return; }
  if (!/^#[0-9a-fA-F]{6}$/.test(color)) { alert("色はカラーコード(#rrggbb)で指定してください。"); return; }

  const existing = await get(ref(db, `countries/${currentUser.uid}`));
  if (existing.exists()) { alert("すでに建国済みです。"); el("claim-modal").classList.add("hidden"); return; }

  await set(ref(db, `countries/${currentUser.uid}`), {
    name, color,
    discordId: myDiscordClaims.discordId,
    discordName: myDiscordClaims.discordName,
    createdAt: serverTimestamp()
  });
  el("claim-modal").classList.add("hidden");
});
function randomHex(){ return "#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0"); }

// ---------- 自国の管理(サイドメニュー) ----------
el("menu-btn").addEventListener("click", () => { renderSideMenu(); el("side-menu").classList.remove("hidden"); });
el("menu-close-btn").addEventListener("click", () => el("side-menu").classList.add("hidden"));
el("menu-create-country-btn").addEventListener("click", () => { el("side-menu").classList.add("hidden"); openClaimModal(); });

function renderSideMenu(){
  const has = !!myCountry;
  el("menu-no-country").classList.toggle("hidden", has);
  el("menu-has-country").classList.toggle("hidden", !has);
  if (!has) return;
  el("edit-country-name").value = myCountry.name;
  el("edit-color-picker").value = myCountry.color;
  el("edit-color-hex").value = myCountry.color;
  const count = Object.values(claimsCache).filter(c => c.ownerUid === currentUser.uid).length;
  el("edit-region-count").textContent = count;
}
el("edit-color-picker").addEventListener("input", (e) => el("edit-color-hex").value = e.target.value);
el("edit-color-hex").addEventListener("input", (e) => {
  if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) el("edit-color-picker").value = e.target.value;
});
el("edit-random-color-btn").addEventListener("click", () => {
  const c = randomHex();
  el("edit-color-picker").value = c;
  el("edit-color-hex").value = c;
});
el("edit-save-btn").addEventListener("click", async () => {
  const name = el("edit-country-name").value.trim();
  const color = el("edit-color-hex").value.trim();
  if (!name) { alert("国名を入力してください。"); return; }
  if (!/^#[0-9a-fA-F]{6}$/.test(color)) { alert("色はカラーコードで指定してください。"); return; }

  const updates = {};
  updates[`countries/${currentUser.uid}/name`] = name;
  updates[`countries/${currentUser.uid}/color`] = color;
  for (const [regionId, claim] of Object.entries(claimsCache)) {
    if (claim.ownerUid === currentUser.uid) {
      updates[`claims/${regionId}/name`] = name;
      updates[`claims/${regionId}/color`] = color;
    }
  }
  await update(ref(db), updates);
  alert("保存しました。");
});
el("edit-delete-country-btn").addEventListener("click", async () => {
  if (!confirm("建国を取り消し、すべての領土を解放します。よろしいですか?")) return;
  const updates = { [`countries/${currentUser.uid}`]: null };
  for (const [regionId, claim] of Object.entries(claimsCache)) {
    if (claim.ownerUid === currentUser.uid) updates[`claims/${regionId}`] = null;
  }
  await update(ref(db), updates);
  el("side-menu").classList.add("hidden");
});

// ---------- 起動 ----------
await handleTokenFromUrl();
</script>
